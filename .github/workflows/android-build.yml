name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test & lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure required SDK components are installed
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "--- installed platforms ---"
          ls -la "$ANDROID_HOME/platforms" || true
          echo "--- installed build-tools ---"
          ls -la "$ANDROID_HOME/build-tools" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Diagnose dependency resolution
        run: |
          ./gradlew :app:dependencies --configuration debugRuntimeClasspath > /tmp/deps.txt 2>&1 || true
          echo "--- recyclerview/cardview/navigation/constraintlayout matches ---"
          grep -iE "recyclerview|cardview|constraintlayout|navigation-fragment|navigation-ui" /tmp/deps.txt || echo "NO MATCHES FOUND"
          echo "--- full dependency tree (first 200 lines) ---"
          head -200 /tmp/deps.txt

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - - name: Run lint
        id: lint
        continue-on-error: true
        run: ./gradlew lint --stacktrace

      - name: Print full lint text report if lint failed
        if: steps.lint.outcome == 'failure'
        run: |
          find app/build -iname 'lint-results*.txt' -exec echo "--- {} ---" \; -exec cat {} \;

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore

      - name: Fail if lint failed
        if: steps.lint.outcome == 'failure'
        run: exit 1

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: phone-doctor-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Check release signing secrets
        id: signing_check
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ] && [ -n "${{ secrets.KEY_ALIAS }}" ] && [ -n "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release signing secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) are not configured for this repository, so release APK/AAB build is skipped. Debug build above is the full result for this run. See README.md 'GitHub Actions / Secrets setup' to enable release builds."
          fi

      - name: Decode release keystore
        if: steps.signing_check.outputs.has_signing == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/release.keystore"

      - name: Build release APK
        if: steps.signing_check.outputs.has_signing == 'true'
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          BANNER_AD_UNIT_ID: ${{ secrets.BANNER_AD_UNIT_ID }}
          INTERSTITIAL_AD_UNIT_ID: ${{ secrets.INTERSTITIAL_AD_UNIT_ID }}
          REWARDED_AD_UNIT_ID: ${{ secrets.REWARDED_AD_UNIT_ID }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Build release AAB
        if: steps.signing_check.outputs.has_signing == 'true'
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          BANNER_AD_UNIT_ID: ${{ secrets.BANNER_AD_UNIT_ID }}
          INTERSTITIAL_AD_UNIT_ID: ${{ secrets.INTERSTITIAL_AD_UNIT_ID }}
          REWARDED_AD_UNIT_ID: ${{ secrets.REWARDED_AD_UNIT_ID }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload release APK
        if: steps.signing_check.outputs.has_signing == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: phone-doctor-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload release AAB
        if: steps.signing_check.outputs.has_signing == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: phone-doctor-release-aab
          path: app/build/outputs/bundle/release/*.aab
